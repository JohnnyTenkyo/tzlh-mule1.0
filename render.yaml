# Render.com Blueprint - Zero-cost deployment
# https://render.com/docs/blueprint-spec

databases:
  - name: tzlh-quant-db
    plan: free
    databaseName: tzlh_quant
    postgresMajorVersion: "16"

services:
  - type: web
    name: tzlh-quant
    runtime: node
    plan: free
    buildCommand: pnpm install && pnpm build && pnpm db:push
    startCommand: pnpm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: tzlh-quant-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: VITE_APP_ID
        value: tzlh-quant-self-hosted
      - key: ALPACA_API_KEY
        sync: false
      - key: ALPACA_SECRET_KEY
        sync: false
      - key: ALPHAVANTAGE_API_KEY
        sync: false
      - key: TIINGO_API_KEY
        sync: false
      - key: FINNHUB_API_KEY
        sync: false
      - key: POLYGON_API_KEY
        sync: false
      - key: TWELVE_DATA_API_KEY
        sync: false
      - key: MARKETSTACK_API_KEY
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_BASE_URL
        value: https://openfly.cc/v1
      - key: OPENAI_MODEL
        value: gpt-5.1-codex
